  # Quantified disease-phenotype findings.
  - source:
      url: 'https://www.ncbi.nlm.nih.gov/sites/books/NBK1156/#ced.T.camuratiengelmann_disease_frequenc'
    statement:
      subject: { encoding: camurati-englemann disease, prioritize: [Disease] }
      predicate: has_phenotype
      object: { encoding: proximal muscle weakness, prioritize: [PhenotypicFeature] }
    annotations:
      - annotation: supporting_text
        encoding: >-
          GeneReviews NBK1156, Clinical Characteristics, Table 2: "Proximal muscle weakness | 62%-67%." Also listed
          under Suggestive Findings. Musculoskeletal description: "Decreased muscle mass and weakness are most apparent
          in the proximal lower limbs, resulting in difficulty when rising from a sitting position." Table 2 sources:
          Wallace et al 2004 (PMID:15326622); Carlson et al 2010 (PMID:20566907); Li et al 2022 (PMID:34490910); Liang
          et al 2022 (PMID:36339419).
