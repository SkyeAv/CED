          GeneReviews NBK1156, Clinical Characteristics, Clinical Description: "Individuals with Camurati-Engelmann
          disease (CED) present with proximal muscle weakness, poor muscular development, a wide-based, waddling gait,
          easy fatigability, bone pain, and headaches."
