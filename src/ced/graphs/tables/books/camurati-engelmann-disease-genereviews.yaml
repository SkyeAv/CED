          Li et al 2022 (PMID:34490910); Liang et al 2022 (PMID:36339419).
  - source:
      url: 'https://www.ncbi.nlm.nih.gov/sites/books/NBK1156/#ced.T.camuratiengelmann_disease_frequenc'
    statement:
      subject: { encoding: camurati-englemann disease, prioritize: [Disease] }
      predicate: has_phenotype
      object: { encoding: bone pain, prioritize: [PhenotypicFeature] }
    annotations:
      - annotation: supporting_text
        encoding: >-
          GeneReviews NBK1156, Clinical Characteristics, Table 2: "Bone pain | 68%-100%." The Summary also lists limb
          pain. Suggestive Findings specifies "Bone pain primarily affecting the lower extremities." Clinical
          Description: "The pain is described as constant, aching, and most intense in the lower limbs. Pain often
          increases with activity, stress, and cold weather. Many individuals have intermittent episodes of severe pain
          and incapacitation." Severity ranges from mild to severe and may decrease in adulthood. Sources: Wallace et al
          2004 (PMID:15326622); Carlson et al 2010 (PMID:20566907); Li et al 2022 (PMID:34490910); Liang et al 2022
          (PMID:36339419); Janssens et al 2006 (PMID:15894597); Yuldashev et al 2017 (PMID:28261436); Hughes et al 2019
          (PMID:30690794).
