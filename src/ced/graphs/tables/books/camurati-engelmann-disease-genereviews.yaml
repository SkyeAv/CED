          p.Leu11_Leu13dup." Molecular Pathogenesis: "the p.Leu11_Leu13dup and p.Tyr81His pathogenic variants caused a
          decrease in the amount of TGFB1 secreted. However, in a luciferase reporter assay specific for TGFB1-induced
          transcriptional response, the mutated cells showed increased luciferase activity, suggesting intracellular
          activation of the receptor." Source: Janssens et al 2003 (PMID:12493741). Table 7 variants were provided by
          the authors and were not independently verified by GeneReviews staff.
