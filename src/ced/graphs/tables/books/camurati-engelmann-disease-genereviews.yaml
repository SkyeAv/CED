  # Mode of inheritance and genetic-counseling context.
  - source:
      url: 'https://www.ncbi.nlm.nih.gov/sites/books/NBK1156/#_ced_Genetic_Counseling_'
    statement:
      subject: { encoding: camurati-englemann disease, prioritize: [Disease] }
      predicate: has_mode_of_inheritance
      object: { encoding: autosomal dominant inheritance, prioritize: [GeneticInheritance] }
    annotations:
      - annotation: supporting_text
        encoding: >-
          GeneReviews NBK1156, Genetic Counseling: "Camurati-Engelmann disease (CED) is inherited in an autosomal
          dominant manner." "Each child of an individual with CED has a 50% chance of inheriting the TGFB1 pathogenic
          variant." Some cases result from a de novo TGFB1 pathogenic variant; the proportion is unknown. Reduced
          penetrance occurs, but exact penetrance is unknown. If a known proband variant is absent from both parents'
          leukocyte DNA, recurrence risk to siblings is estimated at 1% because of possible parental germline mosaicism.
          Sources: Rahbari et al 2016 (PMID:26656846); Wallace et al 2004 (PMID:15326622); Hughes et al 2019
          (PMID:30690794).

