      subject: { encoding: camurati-englemann disease, prioritize: [Disease] }
      predicate: has_phenotype
      object: { encoding: conductive hearing loss, prioritize: [PhenotypicFeature] }
    annotations:
      - annotation: supporting_text
        encoding: >-
          GeneReviews NBK1156, Clinical Characteristics, Neurologic: "Approximately 19%-54% of individuals with CED have
          conductive and/or sensorineural hearing loss." "Conductive loss can be caused by narrowing of the external
          auditory meatus, bony encroachment of the ossicles, or narrowing of the oval and round windows." Sources:
          Carlson et al 2010 (PMID:20566907); Liang et al 2022 (PMID:36339419).
  - source:
      url: 'https://www.ncbi.nlm.nih.gov/sites/books/NBK1156/#_ced_Clinical_Characteristics_'
    statement:
      subject: { encoding: camurati-englemann disease, prioritize: [Disease] }
      predicate: has_phenotype
      object: { encoding: sensorineural hearing loss, prioritize: [PhenotypicFeature] }
    annotations:
      - annotation: supporting_text
        encoding: >-
          GeneReviews NBK1156, Clinical Characteristics, Neurologic: "Approximately 19%-54% of individuals with CED have
          conductive and/or sensorineural hearing loss." "Sensorineural hearing loss is caused by narrowing of the
          internal auditory canal and compression of the cochlear nerve and/or vasculature." It can also occur with
          attempted facial-nerve decompression. Sources: Carlson et al 2010 (PMID:20566907); Liang et al 2022
          (PMID:36339419).
