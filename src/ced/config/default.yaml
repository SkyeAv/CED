schema_version: 1
remote_host: ${CED_REMOTE_HOST:-wenceslaus}
remote_project: ${CED_REMOTE_PROJECT:-/local_raid1/sgoetz/Code/ISB/CED}
artifact_root: ${CED_ARTIFACT_ROOT:-.ced}
fullmap: ${CED_FULLMAP:-/home/sgoetz/Desktop/fullmap}
cpu_workers: ${CED_CPU_WORKERS:-4}
memory_limit: ${CED_MEMORY_LIMIT:-16GB}
disk_reserve_gb: ${CED_DISK_RESERVE_GB:-32}
download_connections: ${CED_DOWNLOAD_CONNECTIONS:-8}
download_jobs: ${CED_DOWNLOAD_JOBS:-4}
source_directory: src/ced/config/sources
graph_config: src/ced/graphs/ced-graph.yaml
modal:
  gpu: L40S
  timeout_seconds: 86400
  single_use_containers: true
  cpu: 8
  memory_mb: 65536
  max_shared_bytes: 68719476736
  max_batch_group_bytes: 8589934592
  retries: 3
  retry_base_seconds: 2
  base_image: nvidia/cuda:12.4.1-cudnn-runtime-ubuntu22.04
  python_version: '3.13'
  torch_index_url: https://download.pytorch.org/whl/cu124
preprocessing:
  isolated_tree_max_nodes: ${CED_ISOLATED_TREE_MAX_NODES:-2}
split:
  seed: 20261110
  train: 0.8
  validation: 0.1
  test: 0.1
  negatives: 16
batch:
  node_limit: 4096
  neighbor_fanout: [16, 8]
evaluation:
  family_prefix: CED:Family_
  hits: [1, 3, 10]
  selection_metric: ced_family.mrr
text_encoding:
  provider: none
  model: sentence-transformers/all-MiniLM-L6-v2
  dimension: 384
  batch_size: 64
  max_length: 256
  normalize: true
  local_files_only: true
  device: auto
  cache_subdirectory: text-embeddings
